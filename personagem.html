<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<title>Personagem - Mesa Aberta</title>
</head>
<body>
<header id="topo"></header>
<main id="conteudo"></main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db.js"></script>
<script src="main.js"></script>
<script>
  const conteudo = document.getElementById('conteudo');
  const ATRIBUTOS = [
    ['forca', 'Força'], ['destreza', 'Destreza'], ['constituicao', 'Constituição'],
    ['inteligencia', 'Inteligência'], ['sabedoria', 'Sabedoria'], ['carisma', 'Carisma']
  ];
  const TIPOS_CAMPO = {
    raca: { nome: 'Raça', formato: 'texto', exemplo: 'Ex.: elfo, saiyajin, kryptoniano...' },
    atributo: { nome: 'Atributo', formato: 'numero', exemplo: 'Valor do atributo' },
    classe: { nome: 'Classe', formato: 'texto', exemplo: 'Ex.: guerreiro, ninja, piloto...' },
    mana: { nome: 'Mana', formato: 'numero', exemplo: 'Quantidade de mana' },
    magia: { nome: 'Magia', formato: 'longo', exemplo: 'Nome, efeito ou descrição da magia' },
    personalizado: { nome: 'Campo personalizado', formato: 'texto', exemplo: 'Escreva qualquer valor' }
  };

  const novo = !param('id');
  let personagem = null;
  let rpg = null;

  function erro(msg) {
    conteudo.innerHTML = '<h1>' + msg + '</h1><p class="intro"><a href="index.html">Voltar para o início</a></p>';
  }

  async function desenhar() {
    const eu = await DB.usuarioAtual();
    const podeEditar = novo || (eu && eu.id === personagem.usuarioId);
    const p = personagem || { nome: '', classe: '', nivel: 1, historia: '', atributos: {}, campos: [] };
    p.atributos = p.atributos || {};
    p.campos = Array.isArray(p.campos) ? p.campos : [];
    document.title = (novo ? 'Novo personagem' : p.nome) + ' - Mesa Aberta';

    conteudo.innerHTML = `
      <p class="meta"><a href="rpg.html?id=${esc(rpg.id)}">${esc(rpg.titulo)}</a></p>
      <h1>${novo ? 'Novo personagem' : esc(p.nome)}</h1>
      ${!podeEditar ? '<p class="intro">Só quem criou este personagem pode editar a ficha.</p>' : '<p class="intro">Preencha a ficha. Você pode voltar e editar quando quiser.</p>'}

      <form id="form-personagem">
        <fieldset ${podeEditar ? '' : 'disabled'}>
          <div class="linha-2">
            <label>Nome
              <input type="text" id="nome" maxlength="60" required value="${esc(p.nome)}">
            </label>
            <label>Classe
              <input type="text" id="classe" maxlength="40" placeholder="Ex.: Mago" value="${esc(p.classe)}">
            </label>
            <label>Nível
              <input type="number" id="nivel" min="1" max="99" value="${esc(p.nivel)}">
            </label>
          </div>

          <h2 style="margin-top:.5rem">Atributos</h2>
          <div class="atributos">
            ${ATRIBUTOS.map(([chave, nome]) => `
              <label class="atributo">${nome}
                <input type="number" id="attr-${chave}" min="1" max="30" value="${esc(p.atributos[chave] ?? 10)}">
              </label>`).join('')}
          </div>

          <section class="secao-campos" aria-labelledby="titulo-campos-extras">
            <div class="cabecalho-campos">
              <div>
                <h2 id="titulo-campos-extras">Outros elementos</h2>
                <p class="meta">Adicione campos do seu sistema ou de qualquer universo.</p>
              </div>
              <button type="button" class="btn sec btn-adicionar-campo" id="btn-adicionar-campo" aria-expanded="false" aria-controls="menu-campos">＋ Adicionar</button>
            </div>
            <div class="menu-campos" id="menu-campos" hidden>
              ${Object.entries(TIPOS_CAMPO).map(([tipo, definicao]) => `<button type="button" class="opcao-campo" data-tipo="${tipo}">${definicao.nome}</button>`).join('')}
            </div>
            <div class="lista-campos-extras" id="lista-campos-extras">
              ${p.campos.map(campo => desenharCampo(campo)).join('')}
            </div>
          </section>

          <label>História
            <textarea id="historia" placeholder="De onde veio, o que quer, o que teme...">${esc(p.historia)}</textarea>
          </label>
        </fieldset>

        ${podeEditar ? `
          <div class="acoes">
            <button type="submit" class="btn">Salvar personagem</button>
            ${novo ? '' : '<button type="button" class="btn perigo" id="btn-excluir">Excluir</button>'}
            <a class="btn sec" href="rpg.html?id=${esc(rpg.id)}">Voltar</a>
          </div>` : '<div class="acoes"><a class="btn sec" href="rpg.html?id=' + esc(rpg.id) + '">Voltar</a></div>'}
      </form>
    `;

    if (!podeEditar) return;

    const form = document.getElementById('form-personagem');
    const menuCampos = document.getElementById('menu-campos');
    const listaCampos = document.getElementById('lista-campos-extras');
    const botaoAdicionarCampo = document.getElementById('btn-adicionar-campo');

    botaoAdicionarCampo.addEventListener('click', () => {
      const aberto = botaoAdicionarCampo.getAttribute('aria-expanded') === 'true';
      botaoAdicionarCampo.setAttribute('aria-expanded', String(!aberto));
      menuCampos.hidden = aberto;
    });

    menuCampos.addEventListener('click', e => {
      const opcao = e.target.closest('[data-tipo]');
      if (!opcao) return;
      const definicao = TIPOS_CAMPO[opcao.dataset.tipo];
      if (!definicao) return;
      listaCampos.insertAdjacentHTML('beforeend', desenharCampo({
        tipo: opcao.dataset.tipo,
        nome: definicao.nome === 'Campo personalizado' ? '' : definicao.nome,
        valor: ''
      }));
      const novoCampo = listaCampos.lastElementChild;
      const rotulo = novoCampo.querySelector('[data-campo-nome]');
      if (rotulo) rotulo.focus();
      menuCampos.hidden = true;
      botaoAdicionarCampo.setAttribute('aria-expanded', 'false');
    });

    listaCampos.addEventListener('click', e => {
      const remover = e.target.closest('[data-remover-campo]');
      if (remover) remover.closest('.campo-extra').remove();
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const botao = form.querySelector('button[type="submit"]');
      botao.disabled = true;
      const atributos = {};
      ATRIBUTOS.forEach(([chave]) => { atributos[chave] = Number(document.getElementById('attr-' + chave).value) || 10; });
      const campos = [...listaCampos.querySelectorAll('.campo-extra')].map(campo => ({
        tipo: campo.dataset.tipo,
        nome: campo.querySelector('[data-campo-nome]').value.trim(),
        valor: campo.querySelector('[data-campo-valor]').value.trim()
      })).filter(campo => campo.nome || campo.valor);
      try {
        await DB.salvarPersonagem({
          id: novo ? undefined : personagem.id,
          rpgId: rpg.id,
          nome: document.getElementById('nome').value.trim(),
          classe: document.getElementById('classe').value.trim(),
          nivel: Number(document.getElementById('nivel').value) || 1,
          atributos,
          campos,
          historia: document.getElementById('historia').value.trim()
        });
        location.href = 'rpg.html?id=' + encodeURIComponent(rpg.id);
      } catch (err) {
        console.error(err);
        alert('Não foi possível salvar o personagem. Tente de novo.');
        botao.disabled = false;
      }
    });

    const excluir = document.getElementById('btn-excluir');
    if (excluir) excluir.addEventListener('click', async () => {
      if (!confirm('Excluir este personagem?')) return;
      try {
        await DB.excluirPersonagem(personagem.id);
        location.href = 'rpg.html?id=' + encodeURIComponent(rpg.id);
      } catch (err) {
        console.error(err);
        alert('Não foi possível excluir.');
      }
    });
  }

  (async () => {
    conteudo.innerHTML = '<p class="vazio">Carregando...</p>';
    try {
      if (!novo) {
        personagem = await DB.buscarPersonagem(param('id'));
        if (!personagem) return erro('Personagem não encontrado');
      }
      const rpgId = personagem ? personagem.rpgId : param('rpg');
      rpg = rpgId ? await DB.buscarRPG(rpgId) : null;
      if (!rpg) return erro('RPG não encontrado');
      if (novo && !(await exigirLogin())) return;
      await desenhar();
    } catch (err) {
      console.error(err);
      erro(err.code === 'permission-denied' ? 'Este RPG é privado' : 'Não foi possível carregar a ficha');
    }
  })();

  function desenharCampo(campo) {
    const tipo = TIPOS_CAMPO[campo.tipo] ? campo.tipo : 'personalizado';
    const definicao = TIPOS_CAMPO[tipo];
    const nome = campo.nome ?? definicao.nome;
    const valor = campo.valor ?? '';
    const controle = definicao.formato === 'longo'
      ? `<textarea data-campo-valor maxlength="1000" placeholder="${esc(definicao.exemplo)}">${esc(valor)}</textarea>`
      : `<input data-campo-valor type="${definicao.formato === 'numero' ? 'number' : 'text'}" ${definicao.formato === 'numero' ? 'min="0" step="any"' : 'maxlength="160"'} placeholder="${esc(definicao.exemplo)}" value="${esc(valor)}">`;
    return `
      <div class="campo-extra" data-tipo="${tipo}">
        <label class="rotulo-campo-extra">${definicao.nome}
          <input data-campo-nome type="text" maxlength="40" aria-label="Nome do campo" value="${esc(nome)}" placeholder="Nome do campo">
        </label>
        <label class="valor-campo-extra">Valor
          ${controle}
        </label>
        <button type="button" class="btn-link remover-campo" data-remover-campo aria-label="Remover campo">Remover</button>
      </div>`;
  }
</script>
</body>
</html>
